name: Radar — publicar y actualizar datos

# Dos procesos distintos en un mismo flujo, sin interferir:
# · Publicar el código: en cada push a main. NO recopila datos (salvo que cambie
#   config/topics.json), así un fallo o límite de la API nunca bloquea un despliegue.
# · Actualizar los datos: cada 12 horas o manualmente. Si la recopilación falla,
#   se publica igualmente con el último catálogo válido guardado en el repositorio.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: 'Recopilar datos nuevos de GitHub antes de publicar'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: homebrew-radar-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el código (última versión de main)
        uses: actions/checkout@v4
        with:
          # La cabeza de main y no el commit del evento: si una recopilación guardó
          # datos mientras este job esperaba en cola, se publican esos datos.
          ref: main
          fetch-depth: 0
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas
        run: npm test
      - name: Lint y tipos
        run: |
          npm run lint
          npm run typecheck

      - name: Decidir si se recopilan datos
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          WANT: ${{ inputs.collect }}
          BEFORE: ${{ github.event.before }}
        run: |
          collect=false
          if [ "$EVENT" = "schedule" ]; then collect=true; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$WANT" != "false" ]; then collect=true; fi
          if [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE" 2>/dev/null && git diff --name-only "$BEFORE" HEAD | grep -q '^config/topics.json$'; then collect=true; fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"
          echo "Recopilar datos: $collect"

      - name: Recopilar proyectos de GitHub
        id: collect
        if: steps.plan.outputs.collect == 'true'
        continue-on-error: true
        run: npm run collect
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validar el catálogo (o restaurar el último válido)
        run: |
          if ! npm run --silent check:feed; then
            echo "::warning::El catálogo nuevo no es válido; se restaura el último guardado."
            git checkout -- public/data/projects.json
            npm run --silent check:feed
          fi

      - name: Guardar el catálogo actualizado
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/projects.json
          if git diff --cached --quiet; then echo "Sin cambios en el catálogo."; exit 0; fi
          git commit -m "Actualizar datos del radar"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            echo "Reintento $attempt al guardar el catálogo…"; sleep 5
          done
          echo "::warning::No se pudo guardar el catálogo en main; se publica igualmente esta compilación."

      - name: Avisar si la recopilación falló
        if: steps.collect.outcome == 'failure'
        run: echo "::warning::La recopilación falló; se publica con el último catálogo válido."

      - name: Compilar la web
        run: npm run build
      - name: Comprobar rutas de GitHub Pages
        run: npm run check:dist
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
